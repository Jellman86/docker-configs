# Drop-in for the upstream t3code.service installed as jellman86.
# Do not run the T3 server as root or grant it passwordless sudo implicitly.
[Unit]
ConditionPathIsMountPoint=/mnt/apps

[Service]
WorkingDirectory=/mnt/apps/developer/jellman86/projects
Environment=PATH=/home/jellman86/.local/bin:/mnt/apps/dev/jellman86/toolchains/mise-data/installs/node/22.23.1/bin:/usr/local/bin:/usr/bin:/bin
Environment=TMPDIR=/mnt/apps/developer/jellman86/tmp
Environment=NPM_CONFIG_CACHE=/mnt/apps/dev/jellman86/cache/npm
# NPM reaches the backend through the host Docker bridge. Host ingress remains
# subject to firewalld; canonical access is HTTPS through NPM or Tailscale Serve.
Environment=T3CODE_HOST=0.0.0.0
Environment=T3CODE_PORT=3773
Environment=T3CODE_TRACE_MAX_BYTES=5242880
Environment=T3CODE_TRACE_MAX_FILES=3
# Contains only the shared least-privilege OpenViking USER key, never a root key.
# Keep this file private and on the developer SSD. No credential value goes here.
EnvironmentFile=/home/jellman86/.t3/provider.env
CPUWeight=100
IOWeight=100
StandardOutput=journal
StandardError=journal
