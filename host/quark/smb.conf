[global]
    server role = standalone server
    security = user
    workgroup = WORKGROUP
    netbios name = QUARK
    server string = Quark file services
    server min protocol = SMB2_02
    map to guest = Never
    usershare allow guests = no
    # Native Tailscale clients retain their tailnet source addresses.
    hosts allow = 127.0.0.1 192.168.0.0/16 100.64.0.0/10
    hosts deny = ALL
    smb ports = 445
    load printers = no
    disable spoolss = yes
    printing = bsd
    printcap name = /dev/null
    cache directory = /var/lib/samba/cache
    log file = /var/log/samba/log.%m
    max log size = 1000

[media]
    path = /mnt/tank/media
    valid users = @media-apps
    read only = no
    guest ok = no
    inherit acls = yes
    create mask = 0660
    directory mask = 0770

[downloads]
    path = /mnt/tank/downloads
    valid users = @media-apps
    read only = no
    guest ok = no
    inherit acls = yes
    create mask = 0660
    directory mask = 0770

[home]
    path = /mnt/tank/home
    valid users = @media-apps
    read only = no
    guest ok = no
    inherit acls = yes
    create mask = 0600
    directory mask = 0700
