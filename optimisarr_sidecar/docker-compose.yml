# Quark development worker. Deploy through its Git-backed Dockhand stack.
services:
  optimisarr-sidecar:
    image: ghcr.io/jellman86/optimisarr-sidecar:dev
    container_name: optimisarr-sidecar
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      OPTIMISARR_SERVER: ${OPTIMISARR_SERVER:-https://optimisarr.pownet.uk}
      # Store the one-use code as a secret in Dockhand, never in Git.
      OPTIMISARR_PAIRING_CODE: ${OPTIMISARR_PAIRING_CODE:-}
      OPTIMISARR_WORKER_NAME: Quark Linux dev
      OPTIMISARR_CONCURRENCY: "1"
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/London
    ports:
      - "192.168.213.102:8788:8788"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - sidecar-config:/config
    tmpfs:
      - /work:size=4g,mode=0700,uid=1000,gid=1000
      - /tmp:size=256m,mode=1777
volumes:
  sidecar-config:
