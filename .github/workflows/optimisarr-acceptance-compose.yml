name: Optimisarr acceptance Compose
on:
  push:
    paths:
      - optimisarr_sidecar_acceptance/**
      - .github/workflows/optimisarr-acceptance-compose.yml
  pull_request:
    paths:
      - optimisarr_sidecar_acceptance/**
      - .github/workflows/optimisarr-acceptance-compose.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f optimisarr_sidecar_acceptance/docker-compose.yml config --quiet
