name: Optimisarr acceptance Compose
on:
  push:
    paths:
      - tools/optimisarr-sidecar-acceptance/**
      - .github/workflows/optimisarr-acceptance-compose.yml
  pull_request:
    paths:
      - tools/optimisarr-sidecar-acceptance/**
      - .github/workflows/optimisarr-acceptance-compose.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f tools/optimisarr-sidecar-acceptance/compose.yaml config --quiet
