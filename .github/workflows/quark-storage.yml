name: Quark storage migration checks
on:
  push:
    paths: &paths
      - tools/**
      - host/quark/**
      - stacks/arr/**
      - stacks/media/**
      - stacks/immich/**
      - stacks/stirling-pdf/**
      - stacks/management/**
      - stacks/ingress/**
      - stacks/home-automation/compose.yaml
      - stacks/optimisarr-sidecar/**
      - .github/workflows/quark-storage.yml
  pull_request:
    paths: *paths
permissions:
  contents: read
jobs:
  container-logging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate resolved log retention for deployed stacks
        env:
          MQTT_USERNAME: ci-placeholder
          MQTT_PASSWORD: ci-placeholder
          FRIGATE_CAMERA_PASSWORD: ci-placeholder
          FRIGATE_RTSP_PASSWORD: ci-placeholder
          BN_LAT: "0"
          BN_LONG: "0"
        run: |
          for source in stacks/management/compose.yaml tools/dockhand-maintenance/compose.yaml stacks/ingress/compose.yaml stacks/home-automation/compose.yaml stacks/optimisarr-sidecar/compose.yaml stacks/media/compose.yaml; do
            docker compose -f "$source" config --format json > /tmp/logging-model.json
            python - "$source" <<'PY'
          import json, re, sys
          model = json.load(open('/tmp/logging-model.json'))
          for name, service in model['services'].items():
              log = service.get('logging', {})
              options = log.get('options', {})
              assert log.get('driver') == 'json-file', (sys.argv[1], name, 'missing bounded logging')
              assert re.fullmatch(r'[1-9][0-9]*[kKmM]', str(options.get('max-size', ''))), (sys.argv[1], name, 'missing file-size limit')
              assert 1 <= int(options.get('max-file', '0')) <= 5, (sys.argv[1], name, 'unbounded file count')
          print(sys.argv[1], 'resolved logging policy passed')
          PY
          done
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s host/quark/tests -v
      - run: pip install pyyaml
      - run: python -m unittest discover -s stacks/immich/tests -v
      - name: Validate native file-server configuration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y samba-common-bin
          sudo mkdir -p /run/samba /var/lib/samba/cache
          testparm --suppress-prompt host/quark/smb.conf
      - name: Validate merged deployment variants
        env:
          DOCKERCONFIGPATH: /mnt/services/docker
          CONFIG_PATH: /mnt/services/docker/pms
          IMMICH_DB_PATH: /mnt/services/docker/immich/postgres18
          IMMICH_DB_PASSWORD: ci-placeholder-only
          IMMICH_PG18_PATH: /tmp/immich-pg18-rehearsal
          IMMICH_PG_UPGRADE_DIR: /tmp/immich-pg18-dump
          TZ: Europe/London
        run: |
          docker compose -f stacks/media/compose.yaml config --format json > /tmp/quark-media.json
          docker compose -f stacks/arr/compose.yaml config --format json > /tmp/quark-arr.json
          docker compose -f stacks/immich/compose.yaml config --format json > /tmp/quark-immich.json
          docker compose -f tools/immich-postgres-upgrade/compose.yaml config --quiet
          docker compose -f stacks/stirling-pdf/compose.yaml config --format json > /tmp/quark-stirling.json
          python host/quark/tests/check_compose.py /tmp/quark-media.json /tmp/quark-arr.json /tmp/quark-immich.json /tmp/quark-stirling.json
