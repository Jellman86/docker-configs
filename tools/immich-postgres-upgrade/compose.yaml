# Temporary isolated restore rehearsal. Remove its Dockhand stack after cutover.
# PostgreSQL 18 requires the parent mount, with PGDATA in 18/docker.
# Stable deployment identity; Dockhand uses the same stack name.
name: immich-postgres-upgrade

services:
  database:
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1@sha256:a20e21841b21b9c009daf572c844ffedfaef75fce51287bbf080edf171ef0834
    container_name: immich-postgres-upgrade
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME:-postgres}
      POSTGRES_DB: ${IMMICH_DB_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - type: bind
        source: ${IMMICH_PG18_PATH:?Set IMMICH_PG18_PATH to an isolated rehearsal directory}
        target: /var/lib/postgresql
        bind: {create_host_path: false}
    shm_size: 128mb
    mem_limit: 2g
    cpus: 2.0
    security_opt: [no-new-privileges:true]
    networks: [upgrade]
    healthcheck: {disable: false}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  restore:
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1@sha256:a20e21841b21b9c009daf572c844ffedfaef75fce51287bbf080edf171ef0834
    container_name: immich-postgres-restore
    restart: "no"
    entrypoint: [pg_restore]
    command: [--exit-on-error, --clean, --if-exists, --no-owner, --no-privileges, "--dbname=${IMMICH_DB_NAME:-immich}", /upgrade/immich.dump]
    environment:
      PGHOST: database
      PGUSER: ${IMMICH_DB_USERNAME:-postgres}
      PGPASSWORD: ${IMMICH_DB_PASSWORD}
    volumes:
      - type: bind
        source: ${IMMICH_PG_UPGRADE_DIR:?Set IMMICH_PG_UPGRADE_DIR to the read-only dump directory}
        target: /upgrade
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      database: {condition: service_healthy}
    mem_limit: 1g
    cpus: 2.0
    security_opt: [no-new-privileges:true]
    networks: [upgrade]
    healthcheck: {disable: true}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  upgrade:
    internal: true
