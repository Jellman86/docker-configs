# One-time offline compatibility test. Never point these binds at production.
name: npmplus-rehearsal

services:
  npmplus:
    image: ghcr.io/zoeyvid/npmplus:2026-10-22-r1@sha256:244fbf14f0c8bfb969434bfacba14ba71f8eee9911a2466035e640d64e594178
    container_name: quark-npmplus-rehearsal
    restart: "no"
    # No egress: copied DNS credentials cannot issue or renew real certificates.
    # Inspect the local API only through Dockhand's execution API.
    network_mode: none
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETGID, SETUID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    environment:
      TZ: Europe/London
      PUID: "1000"
      PGID: "1000"
      COOKIE_SECRET: ${NPMPLUS_REHEARSAL_COOKIE_SECRET:?Set as a Dockhand secret}
      DISABLE_IPV6: "true"
      DISABLE_H3_QUIC: "true"
      NPM_LISTEN_LOCALHOST: "true"
      DISABLE_GRAVATAR: "true"
      LOGROTATE: "true"
      LOGROTATIONS: "3"
    volumes:
      - type: bind
        source: ${NPMPLUS_REHEARSAL_ROOT:?Set to the isolated private copy}/data
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, curl, --insecure, --fail, --silent, https://127.0.0.1:81/]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
