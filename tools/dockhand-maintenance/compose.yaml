# Temporary second Dockhand process for applying this manager's Git-backed
# configuration without killing the process executing its own deployment.
# Remove the stack and its private state after maintenance.
# Stable deployment identity; Dockhand uses the same stack name.
name: dockhand-maintenance

services:
  dockhand-maintenance:
    image: fnsys/dockhand:latest
    container_name: dockhand-maintenance
    restart: "no"
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/London
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind: {create_host_path: false}
      - type: bind
        source: /mnt/services/host/dockhand-maintenance
        target: /app/data
        bind: {create_host_path: false}
    networks:
      - general_brg
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/auth/session >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  general_brg:
    external: true
