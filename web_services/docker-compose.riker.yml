services:
#-----------------------------------------------
  npm:
    container_name: npm
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    networks:
      general_brg:
        aliases:
          - nginx-rp
      vpn_stack_brg:
      media_stack_default:
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - type: bind
        source: ${DOCKERCONFIGPATH:-/mnt/apps/docker}/nginx-proxy-manager/data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: ${DOCKERCONFIGPATH:-/mnt/apps/docker}/nginx-proxy-manager/letsencrypt
        target: /etc/letsencrypt
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 120s
      timeout: 3s
      retries: 3
#-----------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared
    container_name: cloudflare-tunnel
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      general_brg:
    command: tunnel --metrics 127.0.0.1:60123 run
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:60123", "ready"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
#-----------------------------------------------
networks:
    general_brg:
      external: true
    vpn_stack_brg:
      name: ${NETWORK:-arr_stack_brg}
      external: true
    media_stack_default:
      external: true
