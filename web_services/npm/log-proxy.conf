# Access-log formats for Nginx Proxy Manager, bind-mounted over
# /etc/nginx/conf.d/include/log-proxy.conf (see web_services/docker-compose.quark.yml).
#
# Identical to NPM 2.15's shipped formats except that "$request_uri" is replaced by
# "$uri": the path is logged, the query string is not. Applications behind this
# proxy (YA-WAMF's media routes until PR #415, its legacy api_key mode still) carry
# credentials in the query string, and the shipped format copied every one of them
# into /data/logs/proxy-host-*_access.log. A log that records the path alone is as
# useful for traffic and abuse review and records nothing worth stealing.
#
# The runtime copy lives at ${DOCKERCONFIGPATH}/nginx-proxy-manager/data/nginx/custom/log-proxy.conf;
# this file is the reviewed reference. Keep the two identical.
log_format proxy '[$time_local] $upstream_cache_status $upstream_status $status - $request_method $scheme $host "$uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] [Sent-to $server] "$http_user_agent" "$http_referer"';
log_format standard '[$time_local] $status - $request_method $scheme $host "$uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] "$http_user_agent" "$http_referer"';
