services:
  autofpl:
    image: ghcr.io/jellman86/autofpl@sha256:d3ebd0bcd2325607ec196255d5d87ab617795492db690be81224615a215c7013
    container_name: autofpl
    restart: unless-stopped
    user: "1654:1654"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 30s
    expose:
      - "8080"
    networks:
      general_brg:
        aliases:
          - autofpl-api
    healthcheck:
      test: ["CMD", "dotnet", "AutoFpl.Api.dll", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  general_brg:
    name: general_brg
    external: true
