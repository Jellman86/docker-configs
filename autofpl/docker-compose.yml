services:
  autofpl:
    image: ghcr.io/jellman86/autofpl@sha256:0176a6208877e446f10e212218389e497bd5d45517c3897f619fb3e5da5059cb
    container_name: autofpl
    restart: unless-stopped
    user: "1654:1654"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    volumes:
      - type: bind
        source: /mnt/apps/docker/autofpl/data
        target: /data
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 30s
    expose:
      - "8080"
    networks:
      general_brg:
        aliases:
          - autofpl-api
    healthcheck:
      test: ["CMD", "dotnet", "AutoFpl.Api.dll", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  general_brg:
    name: general_brg
    external: true
