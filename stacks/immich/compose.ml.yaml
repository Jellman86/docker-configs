---
# Independent Immich ML stack on Quark, alongside the migrated server stack.
# The server's IMMICH_ML_URL remains http://192.168.213.102:3003. Retain that
# LAN-only endpoint until both stacks are deliberately moved to a shared network.
# This API has no authentication; never publish it through NPM or a tunnel.
# Upstream: https://docs.immich.app/features/ml-hardware-acceleration/

# Stable deployment identity; Dockhand uses the same stack name.
name: immich-ml

services:
  immich-machine-learning:
    # OpenVINO build for the Arrow Lake-S iGPU. The tag suffix is required - the
    # default image carries no OpenVINO runtime.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}-openvino
    container_name: immich-machine-learning
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/London}
      # One worker process limits duplicate resident model sets. Inference thread
      # counts are separate settings; this is not a single-threaded inference flag.
      - MACHINE_LEARNING_WORKERS=${IMMICH_ML_WORKERS:-1}
    volumes:
      - model-cache:/cache
    devices:
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - "c 189:* rmw"
    group_add:
      # Quark's render group is 105; verify it when changing hosts.
      - "${RENDER_GID:-105}"
    # Same-host server uses this retained LAN endpoint. Binding the published
    # port to Quark's LAN IP is narrower than publishing on every host interface.
    ports:
      - "${IMMICH_ML_BIND_ADDR:-192.168.213.102}:${IMMICH_ML_PORT:-3003}:3003"
    security_opt:
      - no-new-privileges:true
    # 8g, not 6g: CLIP (ViT-B-16-SigLIP-512), buffalo_l faces and PP-OCRv5
    # are all resident at once while a backlog drains, which measured 5.4GiB
    # against a 6g cap. Models unload after 300s idle, so this is headroom
    # for the burst rather than steady-state use.
    mem_limit: "${IMMICH_ML_MEMORY_LIMIT:-8g}"
    cpus: "${IMMICH_ML_CPUS:-8.0}"
    healthcheck:
      disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Re-downloadable model weights, cached on Quark so a container recreate does
  # not re-fetch several GB.
  model-cache:
    # Existing Quark volume: project renaming must never create empty state.
    name: immich_ml_model-cache
    external: true
