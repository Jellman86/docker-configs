# Independent AI stack. Internal DNS connects backends; only selected
# authenticated UI/API routes use NPM. Resource caps are ceilings, not
# reserved memory. Hermes, OpenViking and Rusty IMAP MCP were retired on
# 2026-10-18; see README.md (Decommission) for the rationale.
# Stable deployment identity; Dockhand uses the same stack name.
name: ai-tools

services:
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:v0.0.78@sha256:3d871c22ea2d4cca0966e2cfb1860e1cb03eb7353725a3d6cffd133296fb04eb
    container_name: playwright-mcp
    restart: unless-stopped
    init: true
    read_only: true
    shm_size: "1gb"
    pids_limit: 512
    mem_limit: "${PLAYWRIGHT_MCP_MEMORY_LIMIT:-1536m}"
    cpus: "${PLAYWRIGHT_MCP_CPUS:-1.25}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --host=0.0.0.0
      - --port=8931
      - --allowed-hosts=playwright-mcp,playwright-mcp:8931,playwright-mcp.pownet.uk
      - --isolated
      - --block-service-workers
      - --output-mode=stdout
    tmpfs:
      - /home/node:rw,nosuid,nodev,noexec,size=256m,mode=0700,uid=1000,gid=1000
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
    expose:
      - "8931"
    networks:
      general_brg:
        aliases:
          - playwright-mcp
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').createConnection({host:'127.0.0.1',port:8931},()=>{s.end();process.exit(0)});s.setTimeout(3000,()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  openknowledge:
    platform: linux/amd64
    build:
      context: ./openknowledge
      args:
        OPENKNOWLEDGE_VERSION: "${OPENKNOWLEDGE_VERSION:-0.86.22}"
    container_name: openknowledge
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    pids_limit: 512
    mem_limit: "${OPENKNOWLEDGE_MEMORY_LIMIT:-1g}"
    cpus: "${OPENKNOWLEDGE_CPUS:-1.0}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp
      PORT: "8080"
      OK_BIND: 0.0.0.0
      # Consent is safe only behind the authenticating NPM edge; see
      # openknowledge/README.md. Without this pair proxied requests get 403.
      OK_ALLOW_EXTERNAL: "1"
      OK_EXTERNAL_URL: "${OPENKNOWLEDGE_EXTERNAL_URL:-https://openknowledge.pownet.uk}"
    volumes:
      - type: bind
        source: "${DOCKERCONFIGPATH:-/mnt/apps/docker}/openknowledge"
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
      # The server resolves its account home from passwd (/home/node), not
      # $HOME, and needs a writable ~/.ok for its local authority registry.
      - /home/node:rw,nosuid,nodev,noexec,size=64m,mode=0700,uid=1000,gid=1000
    expose:
      - "8080"
    networks:
      npm_proxy_backends:
        aliases:
          - openknowledge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  searxng:
    # Stateless (settings in Git, cache in tmpfs): rolling latest by
    # owner preference; no digest pin without a data/contract reason.
    image: searxng/searxng:latest
    platform: linux/amd64
    container_name: searxng
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    pids_limit: 256
    mem_limit: "${SEARXNG_MEMORY_LIMIT:-1g}"
    cpus: "${SEARXNG_CPUS:-1.0}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Env overrides of server.secret_key / server.base_url; the secret is
      # a Dockhand encrypted variable, never in Git or settings.yml.
      SEARXNG_SECRET: "${SEARXNG_SECRET:?SearXNG secret key required}"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-https://searxng.pownet.uk/}"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /var/cache/searxng:rw,nosuid,nodev,noexec,size=128m,mode=0700,uid=1000,gid=1000
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    expose:
      - "8080"
    networks:
      general_brg:
        aliases:
          - searxng
      npm_proxy_backends:
        aliases:
          - searxng
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  general_brg:
    external: true
  npm_proxy_backends:
    external: true
