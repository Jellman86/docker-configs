# Duplicati reads completed recovery archives and nursery dumps; it never controls other containers.
name: backup
services:
  duplicati:
    image: duplicati/duplicati:latest@sha256:5df64d95abd79ddaa41897a6c234c956d6de03df767a1b8eb8c5baecf3162bbf
    container_name: duplicati
    restart: unless-stopped
    environment:
      QUARK_QUOTA_GUARD_SCRIPT: |
        #!/bin/sh
        # Required preflight for this job. Never print its credential-bearing remote URL.
        set -eu
        export LC_ALL=C
        export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
        umask 077
        fail() { echo "Storage budget guard: $$1" >&2; exit 2; }
        case "$${DUPLICATI__OPERATIONNAME:-}" in
          Restore|List|Test|ListRemote) exit 0 ;; # Recovery/verification must remain possible.
          '') fail 'operation identity missing' ;;
        esac
        case "$${DUPLICATI__REMOTEURL:-}" in
          onedrivev2://QuarkBackups/app-recovery\?*) ;;
          *) fail 'unexpected destination; budget allocation required' ;;
        esac
        # This fixed source envelope is enforced by Quark's local archive producer too.
        # Reserve twice the entire envelope, regardless of the current smaller source.
        source=/source/quark-apps
        count=0
        for file in "$$source"/apps-????????T??????Z.tar.gz; do
          [ -e "$$file" ] || continue
          [ -f "$$file" ] && [ ! -L "$$file" ] || fail 'unsafe source artifact'
          size=$$(stat -c %s "$$file") || fail 'source size unavailable'
          [ "$$size" -gt 0 ] && [ "$$size" -le 4294967296 ] || fail 'source exceeds 4 GiB generation envelope'
          count=$$((count + 1))
        done
        [ "$$count" -gt 0 ] && [ "$$count" -le 3 ] || fail 'expected one to three bounded completed archives'
        listing=$$(mktemp)
        trap 'rm -f "$$listing"' EXIT HUP INT TERM
        # Capture errors privately: backend errors can contain the authenticated URL.
        if ! duplicati-backend-tool list "$$DUPLICATI__REMOTEURL" >"$$listing" 2>&1; then
          fail 'remote inventory failed; refusing writes'
        fi
        # BackendTool lists human-readable rounded sizes. Overestimate each object by
        # one full displayed unit, rather than trusting rounded-down values.
        remote=$$(awk -F '\t' '
        BEGIN { total=0; bad=0; header=0 }
        NR==1 { if ($$1!="Name" || $$2!="Dir/File" || $$4!="Size") bad=1; else header=1; next }
        {
         if (NF!=4 || $$2!="File" || $$1!~/^duplicati-/) { bad=1; next }
         n=split($$4,p," "); unit=p[2]; factor=0
         if (unit=="B" || unit=="bytes" || unit=="byte") factor=1
         if (unit=="KiB") factor=1024
         if (unit=="MiB") factor=1048576
         if (unit=="GiB") factor=1073741824
         if (unit=="TiB") factor=1099511627776
         if (n!=2 || p[1]!~/^[0-9]+([.][0-9]+)?$$/ || factor==0) {bad=1; next}
         total+=(p[1]+1)*factor
        }
        END { if (bad || !header) exit 1; printf "%.0f\n",total }
        ' "$$listing") || fail 'remote inventory could not be bounded'
        # Compaction can temporarily duplicate old remote blocks. Also reserve twice
        # the maximum new source and 1 GiB for encrypted volume/index/manifest overhead.
        # This intentionally stops well before the nominal allocation becomes full.
        projected=$$((2 * remote + 2 * 3 * 4294967296 + 1073741824))
        [ "$$projected" -le 100000000000 ] || fail '100 GB Quark allocation would be exceeded including headroom; existing backups preserved'
        echo "Storage budget guard passed: conservative remote bytes=$$remote; peak bound=$$projected; allocation=100000000000"
      CROFTVIEW_QUOTA_GUARD_SCRIPT: |
        #!/bin/sh
        # Required preflight for the Croftview nursery job. Never print its credential-bearing remote URL.
        set -eu
        export LC_ALL=C
        export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
        umask 077
        fail() { echo "Storage budget guard: $$1" >&2; exit 2; }
        case "$${DUPLICATI__OPERATIONNAME:-}" in
          Restore|List|Test|ListRemote) exit 0 ;; # Recovery/verification must remain possible.
          '') fail 'operation identity missing' ;;
        esac
        case "$${DUPLICATI__REMOTEURL:-}" in
          onedrivev2://QuarkBackups/croftview\?*) ;;
          *) fail 'unexpected destination; budget allocation required' ;;
        esac
        # Croftview's files on Quark's receiver: hourly GrowLog (Quark keeps 168), WordPress and Authentik dumps
        # (48 each) and nightly Boothby captures (3). Reserve twice the whole 16 GiB nursery envelope.
        source=/source/croftview
        total=0
        check() { # pattern, most files, largest file in bytes, description
          count=0
          for file in "$$source"/$$1; do
            [ -e "$$file" ] || continue
            [ -f "$$file" ] && [ ! -L "$$file" ] || fail 'unsafe source artifact'
            size=$$(stat -c %s "$$file") || fail 'source size unavailable'
            [ "$$size" -gt 0 ] && [ "$$size" -le "$$3" ] || fail "a $$4 file is outside its size envelope"
            count=$$((count + 1))
            total=$$((total + size))
          done
          [ "$$count" -le "$$2" ] || fail "more than $$2 $$4 files"
          found=$$((found + count))
        }
        found=0
        check 'growlog-????????T??????Z.dump' 200 1073741824 GrowLog
        check 'wordpress-????????T??????Z.sql.gz' 60 1073741824 WordPress
        check 'authentik-????????T??????Z.dump' 60 1073741824 Authentik
        check 'boothby-????????T??????Z.tar.gz' 3 4294967296 'Boothby capture'
        [ "$$found" -gt 0 ] || fail 'no completed backups to send'
        [ "$$total" -le 17179869184 ] || fail 'source exceeds the 16 GiB nursery envelope'
        listing=$$(mktemp)
        trap 'rm -f "$$listing"' EXIT HUP INT TERM
        # Capture errors privately: backend errors can contain the authenticated URL.
        if ! duplicati-backend-tool list "$$DUPLICATI__REMOTEURL" >"$$listing" 2>&1; then
          fail 'remote inventory failed; refusing writes'
        fi
        # BackendTool lists human-readable rounded sizes. Overestimate each object by
        # one full displayed unit, rather than trusting rounded-down values.
        remote=$$(awk -F '\t' '
        BEGIN { total=0; bad=0; header=0 }
        NR==1 { if ($$1!="Name" || $$2!="Dir/File" || $$4!="Size") bad=1; else header=1; next }
        {
         if (NF!=4 || $$2!="File" || $$1!~/^duplicati-/) { bad=1; next }
         n=split($$4,p," "); unit=p[2]; factor=0
         if (unit=="B" || unit=="bytes" || unit=="byte") factor=1
         if (unit=="KiB") factor=1024
         if (unit=="MiB") factor=1048576
         if (unit=="GiB") factor=1073741824
         if (unit=="TiB") factor=1099511627776
         if (n!=2 || p[1]!~/^[0-9]+([.][0-9]+)?$$/ || factor==0) {bad=1; next}
         total+=(p[1]+1)*factor
        }
        END { if (bad || !header) exit 1; printf "%.0f\n",total }
        ' "$$listing") || fail 'remote inventory could not be bounded'
        # Compaction can temporarily duplicate old remote blocks. Also reserve twice
        # the maximum new source and 1 GiB for encrypted volume/index/manifest overhead.
        # This intentionally stops well before the nominal allocation becomes full.
        projected=$$((2 * remote + 2 * 17179869184 + 1073741824))
        [ "$$projected" -le 100000000000 ] || fail '100 GB Croftview allocation would be exceeded including headroom; existing backups preserved'
        echo "Storage budget guard passed: conservative remote bytes=$$remote; peak bound=$$projected; allocation=100000000000"
      TZ: Europe/London
      SETTINGS_ENCRYPTION_KEY: ${DUPLICATI_SETTINGS_KEY:?Set a secret in Dockhand}
      DUPLICATI__WEBSERVICE_PASSWORD: ${DUPLICATI_UI_PASSWORD:?Set a secret in Dockhand}
      DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES: ${DUPLICATI_ALLOWED_HOSTNAMES:-backup.pownet.uk}
      DUPLICATI__WEBSERVICE_INTERFACE: any
    command:
      - /bin/sh
      - -ec
      - |
        printf '%s\n' "$$QUARK_QUOTA_GUARD_SCRIPT" > /opt/quark-backup-quota-guard
        chmod 0555 /opt/quark-backup-quota-guard
        printf '%s\n' "$$CROFTVIEW_QUOTA_GUARD_SCRIPT" > /opt/croftview-backup-quota-guard
        chmod 0555 /opt/croftview-backup-quota-guard
        exec duplicati-server
    networks:
      npm_proxy_backends: {}
      egress:
        gw_priority: 1
    volumes:
      - type: bind
        source: /mnt/services/quark/docker/duplicati
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /mnt/tank/backups/apps
        target: /source/quark-apps
        read_only: true
        bind:
          create_host_path: false
      # GrowLog dumps that Boothby copies to Quark's restricted receiver every hour.
      - type: bind
        source: /mnt/tank/backups/croftview/incoming
        target: /source/croftview
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    mem_limit: 1g
    cpus: 1.0

networks:
  npm_proxy_backends:
    external: true
  egress: {}
