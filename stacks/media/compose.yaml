# Quark's storage guard owns startup and crash recovery through Dockhand.
# Docker must never restart these independently before the USB mirror is ready.
# Stable deployment identity; Dockhand uses the same stack name.
name: media

services:
  plex:
    extends: {file: compose.base.yaml, service: plex}
    restart: "no"
    volumes:
      # Transcode workspace in RAM: no SSD wear and faster segment I/O. Capped
      # so a large download/sync conversion cannot exhaust host memory; the
      # contents are disposable. Plex's TranscoderTempDirectory is /transcode.
      - type: tmpfs
        target: /transcode
        tmpfs:
          size: 4294967296
          mode: 01777
  jellyfin:
    extends: {file: compose.base.yaml, service: jellyfin}
    restart: "no"
  optimisarr:
    extends: {file: compose.base.yaml, service: optimisarr}
    restart: "no"
    networks:
      general_brg:

networks:
  arr_stack_brg:
    name: ${ARR_NETWORK:-arr_stack_brg}
    external: true
  general_brg:
    name: general_brg
    external: true
