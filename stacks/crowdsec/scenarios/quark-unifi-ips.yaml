# Observation only: any UniFi CyberSecure IPS detection (CEF security
# detections, e.g. "Threat Detected and Blocked"), including attacks on the
# Plex forward. One alert per source per hour.
type: trigger
name: quark/unifi-ips
description: "UniFi IPS detection"
filter: "evt.Meta.service == 'unifi' && evt.Meta.source_ip != '' && (evt.Meta.subcategory contains 'Intrusion' || evt.Meta.ips_signature != '')"
groupby: evt.Meta.source_ip
blackhole: 1h
labels:
  remediation: false
  service: unifi
  behavior: "generic:exploit"
  label: "UniFi IPS detection"
  confidence: 2
  spoofable: 0
