# CrowdSec security engine and dashboard. The engine reads NPM's access/error
# logs read-only, so ingress is never recreated by a CrowdSec update. Nothing
# here publishes a host port; the dashboard is reached only through NPM.
# https://docs.crowdsec.net/u/getting_started/installation/docker
# https://github.com/TheDuffman85/crowdsec-web-ui
# Stable deployment identity; Dockhand uses the same stack name.
name: crowdsec

services:
  crowdsec:
    # Agent + Local API. Hub collections are installed/upgraded at start.
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      COLLECTIONS: >-
        crowdsecurity/nginx-proxy-manager
        crowdsecurity/whitelist-good-actors
    volumes:
      # Engine config (machine credentials, Console enrollment) is recovery state.
      - type: bind
        source: /mnt/services/quark/docker/crowdsec/config
        target: /etc/crowdsec
        bind:
          create_host_path: true
      # Alert/decision SQLite and hub data are rebuildable; not in app recovery.
      - type: bind
        source: /mnt/services/quark/docker/crowdsec/data
        target: /var/lib/crowdsec/data
        bind:
          create_host_path: true
      - type: bind
        source: /mnt/services/quark/docker/nginx-proxy-manager/data/logs
        target: /var/log/npm
        read_only: true
        bind:
          create_host_path: false
      # Reviewed Git config layered over the generated defaults.
      - ./acquis.d/npm.yaml:/etc/crowdsec/acquis.d/npm.yaml:ro
      - ./parsers/quark-private-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/quark-private-whitelist.yaml:ro
      - ./config.yaml.local:/etc/crowdsec/config.yaml.local:ro
    networks:
      lapi:
        ipv4_address: 172.24.24.10
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-ui-machine:
    # One-shot, idempotent: (re)registers the dashboard's LAPI machine with the
    # Dockhand-held password on every deploy, so no manual cscli step exists.
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec-web-ui-machine
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cscli machines add crowdsec-web-ui --password "$$WEB_UI_LAPI_PASSWORD" --force -f /dev/null
    environment:
      WEB_UI_LAPI_PASSWORD: ${CROWDSEC_WEB_UI_LAPI_PASSWORD:?Set a random secret in Dockhand}
    volumes:
      - type: bind
        source: /mnt/services/quark/docker/crowdsec/config
        target: /etc/crowdsec
        bind:
          create_host_path: true
      - type: bind
        source: /mnt/services/quark/docker/crowdsec/data
        target: /var/lib/crowdsec/data
        bind:
          create_host_path: true
      - ./config.yaml.local:/etc/crowdsec/config.yaml.local:ro
    network_mode: none
    security_opt:
      - no-new-privileges:true
    depends_on:
      crowdsec:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  crowdsec-web-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:latest
    container_name: crowdsec-web-ui
    # Upstream `node` user; the data directory is pre-created as 1000:1000.
    user: "1000:1000"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      CONFIG_INSTANCE_LAPI_URL: http://crowdsec:8080
      CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
      CONFIG_INSTANCE_LAPI_AUTH_PASSWORD: ${CROWDSEC_WEB_UI_LAPI_PASSWORD:?Set a random secret in Dockhand}
      CONFIG_INSTANCE_METRICS_URL: http://crowdsec:6060/metrics
      # Local admin login is always required, even on the private network.
      CONFIG_AUTH_ENABLED: "true"
    volumes:
      # Dashboard accounts, sessions and notification settings (SQLite + WAL).
      - type: bind
        source: /mnt/services/quark/docker/crowdsec/web-ui
        target: /app/data
        bind:
          create_host_path: false
    expose:
      - "3000"
    networks:
      lapi:
        ipv4_address: 172.24.24.20
      npm_proxy_backends:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      web-ui-machine:
        condition: service_completed_successfully
    # Upstream image HEALTHCHECK probes /api/health.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Private LAPI segment. Fixed so config.yaml.local can trust only the dashboard.
  lapi:
    ipam:
      config:
        - subnet: 172.24.24.0/24
  npm_proxy_backends:
    name: npm_proxy_backends
    external: true
