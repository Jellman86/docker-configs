# CrowdSec security engine (observation only). It reads NPM and media-app
# logs read-only, so ingress is never recreated by a CrowdSec update, and
# receives UniFi syslog on the LAN. The dashboard is the hosted CrowdSec
# Console (app.crowdsec.net); there is no self-hosted UI.
# https://docs.crowdsec.net/u/getting_started/installation/docker
# Stable deployment identity; Dockhand uses the same stack name.
name: crowdsec

services:
  crowdsec:
    # Agent + Local API. Hub collections are installed/upgraded at start.
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      # CrowdSec Console (app.crowdsec.net) enrollment. The key is an encrypted
      # Dockhand variable; empty skips enrollment. A wrong key stops startup.
      ENROLL_KEY: ${CROWDSEC_ENROLL_KEY:-}
      ENROLL_INSTANCE_NAME: quark
      ENROLL_TAGS: quark homelab
      # Observation of private media apps' sign-in failures; see README.
      COLLECTIONS: >-
        crowdsecurity/nginx-proxy-manager
        crowdsecurity/whitelist-good-actors
        LePresidente/jellyfin
        LePresidente/overseerr
        schiz0phr3ne/sonarr
        schiz0phr3ne/radarr
        schiz0phr3ne/prowlarr
        gilbsgilbs/qbittorrent
        crowdsecurity/unifi
    volumes:
      # Engine config (machine credentials, Console enrollment) is recovery state.
      - type: bind
        source: /mnt/services/quark/docker/crowdsec/config
        target: /etc/crowdsec
        bind:
          create_host_path: true
      # Alert/decision SQLite and hub data are rebuildable; not in app recovery.
      - type: bind
        source: /mnt/services/quark/docker/crowdsec/data
        target: /var/lib/crowdsec/data
        bind:
          create_host_path: true
      - type: bind
        source: /mnt/services/quark/docker/nginx-proxy-manager/data/logs
        target: /var/log/npm
        read_only: true
        bind:
          create_host_path: false
      # Media/arr app log directories only, never their config or databases.
      - type: bind
        source: /mnt/services/docker/jellyfin/log
        target: /var/log/apps/jellyfin
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/services/docker/seerr/logs
        target: /var/log/apps/seerr
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/services/docker/sonarr/logs
        target: /var/log/apps/sonarr
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/services/docker/radarr/logs
        target: /var/log/apps/radarr
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/services/docker/prowlarr/logs
        target: /var/log/apps/prowlarr
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/services/docker/qbittorrent/qBittorrent/logs
        target: /var/log/apps/qbittorrent
        read_only: true
        bind:
          create_host_path: false
      # Reviewed Git config layered over the generated defaults.
      - ./acquis.d:/etc/crowdsec/acquis.d:ro
      - ./parsers/quark-private-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/quark-private-whitelist.yaml:ro
      # UniFi gateway hostname repair; the "a-" prefix runs it before unifi-logs.
      - ./parsers/quark-unifi-syslog-host.yaml:/etc/crowdsec/parsers/s00-raw/a-quark-unifi-syslog-host.yaml:ro
      - ./config.yaml.local:/etc/crowdsec/config.yaml.local:ro
    ports:
      # UniFi remote syslog from the UCG-Max. LAN address only, never WAN/tailnet.
      - "192.168.213.102:5514:5514/udp"
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
