# qBittorrent WebAPI login failures (gilbsgilbs/qbittorrent).
source: file
filenames:
  - /var/log/apps/qbittorrent/qbittorrent.log
labels:
  type: qbittorrent
# Drop lines no parser uses before parsing (an empty list emits no event),
# so routine app/device chatter is not counted as unparsed.
transform: "(evt.Line.Raw contains 'WebAPI login failure') ? [evt.Line.Raw] : []"
