# CrowdSec's syslog server treats the leading digits of the UCG-Max hostname
# "3-Bank-Street" as the RFC3164 tag, so every gateway line arrives as
#   "<ts> 3-Bank-Street 3: -Bank-Street [WAN_LOCAL-D-10000] DESCR=... SRC=... DPT=..."
# and crowdsecurity/unifi-logs sees program "3" instead of "kernel"/"dropbear".
# This s00 parser (mounted with an "a-" prefix so it runs first) re-splits
# those lines with the same outputs as unifi-logs; s01 hub parsers
# (iptables-logs, dropbear-logs) and their scenarios then work unchanged.
name: quark/unifi-syslog-host
description: "Repair UniFi gateway syslog lines whose hostname starts with digits"
filter: "evt.Line.Labels.type == 'unifi' && evt.Line.Raw matches '^[A-Z][a-z]{2} +[0-9]+ [0-9:]+ [^ ]+ [^ :]+: -[^ ]+ '"
onsuccess: next_stage
nodes:
  - grok:
      pattern: '^%{SYSLOGTIMESTAMP:timestamp} %{NOTSPACE:hostname} %{NOTSPACE}: %{NOTSPACE} %{GREEDYDATA:unifi_body}'
      apply_on: Line.Raw
    nodes:
      # Kernel firewall log from a UniFi policy with Syslog logging enabled.
      - grok:
          pattern: '\[WAN_%{DATA:dst_zone}-%{DATA:action}-%{INT:rule_id}\] %{GREEDYDATA:message}'
          apply_on: unifi_body
        statics:
          - parsed: program
            value: kernel
      # Ordinary daemon line, e.g. "dropbear[123]: ...".
      - grok:
          pattern: '^%{SYSLOGPROG}: ?%{GREEDYDATA:message}'
          apply_on: unifi_body
statics:
  - meta: machine
    expression: evt.Parsed.hostname
  - parsed: logsource
    value: syslog
  - target: evt.StrTime
    expression: evt.Parsed.timestamp
  - meta: datasource_path
    expression: evt.Line.Src
  - meta: datasource_type
    expression: evt.Line.Module
  - meta: action
    expression: 'evt.Parsed.action == "" ? "" : evt.Parsed.action == "A" ? "accept" : (evt.Parsed.action == "D" ? "drop" : (evt.Parsed.action == "R" ? "reject" : "unknown"))'
  - meta: log_type
    expression: 'evt.Meta.action not in ["accept", "unknown", ""] ? "iptables_drop" : ""'
