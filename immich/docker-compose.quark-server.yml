# Reuse Quark's existing immich_ml worker rather than starting a second one.
services:
  immich-server:
    extends: {file: docker-compose.yml, service: immich-server}
    restart: "no"
  immich-database:
    extends: {file: docker-compose.yml, service: immich-database}
    restart: "no"
  immich-redis:
    extends: {file: docker-compose.yml, service: immich-redis}
    restart: "no"

networks:
  general_brg:
    name: general_brg
    external: true
  immich_backend:
    name: ${IMMICH_BACKEND_NETWORK:-immich_backend}
    driver: bridge
