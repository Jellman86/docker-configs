services:
  twenty:
    image: ghcr.io/jellman86/twenty:dev
    pull_policy: always
    container_name: twenty
    restart: unless-stopped
    user: "1654:1654"
    init: true
    read_only: true
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_EnableDiagnostics: "0"
      TWENTY_DATA_ROOT: /data
    volumes:
      - twenty_data:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    expose:
      - "8080"
    networks:
      general_brg:
        aliases:
          - twenty-api
    healthcheck:
      test: ["CMD", "dotnet", "Twenty.Api.dll", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  general_brg:
    name: general_brg
    external: true

volumes:
  twenty_data:
